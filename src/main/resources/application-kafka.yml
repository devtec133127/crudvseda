# Spring Profile: kafka
# Aktivierung: --spring.profiles.active=kafka
# Zweck: Produktionsreife Event-Verarbeitung mit Kafka + Outbox Pattern

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true

# Outbox-Pattern aktiviert
outbox:
  table: outbox
  publish-interval-ms: 500
  batch-size: 100
  publisher:
    enabled: true

logging:
  level:
    org.springframework.kafka: INFO
    de.demo.lending.common.adapters.out.outbox: DEBUG
    de.demo.lending.inventory.adapters.in.messaging: DEBUG
