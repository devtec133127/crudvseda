databaseChangeLog:

  # Gemeinsame Outbox einbinden
  - include:
      file: classpath:/db/changelog/common/outbox.yaml

  # Loan-Tabellen
  - changeSet:
      id: loan-001
      author: you
      changes:
        - createTable:
            tableName: loan
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: copy_id
                  type: UUID
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - createIndex:
            tableName: loan
            indexName: idx_loan_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: loan
            indexName: idx_loan_book
            columns:
              - column:
                  name: book_id

  # Optional: Tabelle zur Idempotenzkontrolle (Processed Events)
  - changeSet:
      id: loan-002
      author: you
      changes:
        - createTable:
            tableName: processed_event
            columns:
              - column:
                  name: event_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: received_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false