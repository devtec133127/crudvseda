databaseChangeLog:
  - changeSet:
      id: 002-create-payments-table
      author: marcel.zinnow (generated)
      changes:
        - createTable:
            tableName: payments
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: loan_id
                  type: uuid
                  constraints:
                    nullable: true  # Optional, für Loan-spezifische Zahlungen
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: loan_id
            constraintName: fk_payments_loans
            referencedTableName: loans
            referencedColumnNames: id
            onDelete: CASCADE