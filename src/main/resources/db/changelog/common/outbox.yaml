databaseChangeLog:

  - changeSet:
      id: outbox-001
      author: you
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: headers
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
                    defaultValueComputed: now()
              - column:
                  name: published_at
                  type: TIMESTAMPTZ
              - column:
                  name: attempt
                  type: INT
                  constraints:
                    nullable: false
                    defaultValueNumeric: 0

        - createIndex:
            tableName: outbox
            indexName: idx_outbox_published
            columns:
              - column:
                  name: published_at

        - createIndex:
            tableName: outbox
            indexName: idx_outbox_type
            columns:
              - column:
                  name: type