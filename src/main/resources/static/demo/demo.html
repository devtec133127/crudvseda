<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>EDA Demo - Loan System</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="container">
    <h1>Event-Driven Loan Request Demo</h1>

    <div>
        <label for="bookTitleInput"
               style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">
            Buch Titel:
        </label>
        <input type="text" id="bookTitleInput"
               placeholder="z.B. Java für Anfänger, Python for Dummies, Spring Boot, ..." value="Java"
               style="width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--border-color); border-radius: var(--border-radius)"/>
    </div>

    <button id="createLoanBtn" class="primary-button">
        Neuen Loan Request erstellen
    </button>

    <div id="initialResponse" class="response-card hidden">
        <h3>Initial Response (Loan Service)</h3>
        <div class="response-content"></div>
    </div>

    <!-- Timeline für Events -->
    <div id="timeline" class="hidden">
        <h3>Event Processing Timeline</h3>

        <!-- Hier kommen die Events rein - Container muss leer starten! -->
        <div id="events"></div>
    </div>


    <div id="finalStatus" class="response-card hidden success">
        <h3>✅ Final Status</h3>
        <div class="response-content"></div>
    </div>
</div>

<script src="demo.js"></script>
</body>
</html>
