# Retry- bzw. Dead-Letter-Tabelle ist Gold wert, sobald Events beim Publizieren hängen bleiben.
# Events werden nicht sofort gelöscht

databaseChangeLog:

  - changeSet:
      id: outbox-retry-001
      author: you
      changes:
        - createTable:
            tableName: outbox_retry
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: original_outbox_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: headers
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
                    defaultValueComputed: now()
              - column:
                  name: failure_reason
                  type: TEXT
              - column:
                  name: last_attempt_at
                  type: TIMESTAMPTZ
              - column:
                  name: attempt_count
                  type: INT
                  constraints:
                    nullable: false
                    defaultValueNumeric: 1

        - addForeignKeyConstraint:
            baseTableName: outbox_retry
            baseColumnNames: original_outbox_id
            referencedTableName: outbox
            referencedColumnNames: id
            constraintName: fk_outbox_retry_original

        - createIndex:
            tableName: outbox_retry
            indexName: idx_outbox_retry_type
            columns:
              - column:
                  name: type