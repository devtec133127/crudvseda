databaseChangeLog:

  # Gemeinsame Outbox einbinden
  - include:
      file: classpath:/db/changelog/common/outbox.yaml

  # Accounting-Schema
  - changeSet:
      id: accounting-001
      author: marcel.zinnow (generated)
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: loan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
        - createIndex:
            tableName: payment
            indexName: idx_payment_loan
            columns:
              - column:
                  name: loan_id
        - createIndex:
            tableName: payment
            indexName: idx_payment_user
            columns:
              - column:
                  name: user_id

  # Optional: Buchungs- oder Transaktions-Tabelle
  - changeSet:
      id: accounting-002
      author: you
      changes:
        - createTable:
            tableName: transaction_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transaction_log
            baseColumnNames: payment_id
            referencedTableName: payment
            referencedColumnNames: id
            constraintName: fk_transaction_payment
