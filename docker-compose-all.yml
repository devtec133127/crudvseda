services:
  
  # PostgreSQL Datenbank
  postgres:
    image: postgres:15-alpine
    container_name: lending-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lending
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lending-network

  # Kafka (nur für kafka-Profile benötigt)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: lending-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - lending-network
    profiles:
      - kafka  # ← Startet nur bei --profile kafka

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: lending-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - lending-network
    profiles:
      - kafka  # ← Startet nur bei --profile kafka

  # Loan Service (mit wählbarem Spring Profile)
  loan-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lending-loan-service
    depends_on:
      postgres:
        condition: service_healthy
      # kafka:  # Optional: auskommentieren für kafka-Profile
      #   condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Spring Profile über Umgebungsvariable
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-async}  # Default: async
      
      # Service-Rolle
      SERVICE_ROLE: loan
      
      # Datenbank-Verbindung
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lending
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      
      # Kafka-Connection (nur relevant bei kafka-Profile)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lending-network

  # Inventory Service (mit wählbarem Spring Profile)
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lending-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      # kafka:  # Optional: auskommentieren für kafka-Profile
      #   condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-async}  # Default: async
      SERVICE_ROLE: inventory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lending
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lending-network

volumes:
  postgres-data:

networks:
  lending-network:
    driver: bridge
