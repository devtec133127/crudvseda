services:
  
  # PostgreSQL Datenbank
  postgres:
    image: postgres:15-alpine
    container_name: lending-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lending
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lending-network

volumes:
  postgres-data:

networks:
  lending-network:
    driver: bridge
