services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports: ["5435:5432"]
    volumes:
      - ./infra/init-multi-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
        --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092","9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --api-urls=localhost:9644 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.1.3
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    ports: ["8080:8080"]

  loan:
    build:
      context: .
      dockerfile: Dockerfile
    image: lending-system:0.0.1-SNAPSHOT
    pull_policy: never
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: loan
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: redpanda:9092
    ports: ["8081:8081"]

  inventory:
    build:
      context: .
      dockerfile: Dockerfile
    image: lending-system:0.0.1-SNAPSHOT
    pull_policy: never
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: inventory
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: redpanda:9092
    ports: ["8082:8082"]

  accounting:
    build:
      context: .
      dockerfile: Dockerfile
    image: lending-system:0.0.1-SNAPSHOT
    pull_policy: never
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: accounting
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: redpanda:9092
    ports: ["8083:8083"]